server:
  port: 8888

spring:
  application:
    name: auction-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: seller-service
              uri: http://localhost:8081
              order: 1
              predicates:
                - Path=/api/admin/apply/list,/api/admin/*/approve,/api/admin/*/reject,/api/admin/seller/*/apply,/api/user/seller/apply,/api/user/*/modify,/api/user/*/cancel,/api/user/reject/reason

            - id: product-service
              uri: http://localhost:8082
              order: 2
              predicates:
                - Path=/api/product,/api/product/**,/api/admin/*/product

            - id: order-service
              uri: http://localhost:8083
              order: 3
              predicates:
                - Path=/api/order,/api/order/**,/api/admin/*/order

            - id: bid-service
              uri: http://localhost:8084
              order: 4
              predicates:
                - Path=/api/auction,/api/auction/**,/api/admin/*/bid,/api/admin/*/bid-list/*

            - id: category-service
              uri: http://localhost:8085
              order: 5
              predicates:
                - Path=/api/category,/api/category/**

            - id: rating-service
              uri: http://localhost:8086
              order: 6
              predicates:
                - Path=/api/rating,/api/rating/**

            - id: user-service
              uri: http://localhost:8087
              order: 100
              predicates:
                - Path=/api/user,/api/user/**,/api/auth/**,/api/admin/**

management:
  endpoints:
    web:
      exposure:
        include: gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG
    org.springframework.boot: INFO

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000