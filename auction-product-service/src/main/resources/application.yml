server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: auction_user
    password: auction_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 1234

cloud:
  aws:
    s3:
      bucket: local-bucket  # MinIO 버킷명
      endpoint: http://localhost:9000 # MinIO 주소
    region:
      static: us-east-1 # MinIO는 보통 기본값
    credentials:
      access-key: minioadmin # MinIO ID
      secret-key: minioadmin # MinIO PW

  threads:
    virtual:
      enabled: true

# JWT
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}